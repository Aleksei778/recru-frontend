services:
  node:
    image: node:25-alpine
    working_dir: /app
    container_name: recru_node
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
    networks:
      default:
        ipv4_address: 172.75.0.8

networks:
  default:
    name: recru_network
    external: true
    driver: bridge
